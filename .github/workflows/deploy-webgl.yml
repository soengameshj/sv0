name: Deploy WebGL to Pages
run-name: WebGL ${{ inputs.release }}
on:
  workflow_dispatch:
    inputs:
      release:
        description: WebGL release tag
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download WebGL release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE: ${{ inputs.release }}
        run: |
          gh release download "$RELEASE" --pattern webgl.zip
          mkdir site
          unzip -q webgl.zip -d site
          test -f site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
